name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inlined into the Next.js build (public value, same as in wrangler.jsonc vars).
      NEXT_PUBLIC_SITE_URL: https://tidal-mcp.nelson-ona.workers.dev
      TIDAL_CLIENT_ID: xFeY632WQat6UkN4
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          fail=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or empty"; fail=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; fail=1; fi
          exit $fail
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci 2>&1 | tee ../step.log
      - name: Install OpenNext Cloudflare adapter and Wrangler (not saved, keeps the lockfile valid)
        run: npm install --no-save @opennextjs/cloudflare@latest wrangler@latest 2>&1 | tee ../step.log
      - name: Build
        run: npx opennextjs-cloudflare build 2>&1 | tee ../step.log
      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee ../step.log
      - name: Set setlist.fm API key (optional secret)
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          if [ -n "$SETLISTFM_API_KEY" ]; then
            printf '%s' "$SETLISTFM_API_KEY" | npx wrangler secret put SETLISTFM_API_KEY 2>&1 | tee ../step.log
          else
            echo "::warning::SETLISTFM_API_KEY repository secret not set; setlist tools will report that they are not configured."
          fi
      - name: Surface the last log lines as an annotation on failure
        if: failure()
        working-directory: .
        run: |
          if [ -f step.log ]; then
            msg=$(tail -n 40 step.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Last log lines::${msg}"
          fi
