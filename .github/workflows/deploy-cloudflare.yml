name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inlined into the Next.js build (public value, same as in wrangler.jsonc vars).
      NEXT_PUBLIC_SITE_URL: https://tidal-mcp.nelson-ona.workers.dev
      TIDAL_CLIENT_ID: xFeY632WQat6UkN4
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing repository secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install OpenNext Cloudflare adapter and Wrangler (not saved, keeps the lockfile valid)
        run: npm install --no-save @opennextjs/cloudflare@latest wrangler@latest
      - name: Build
        run: npx opennextjs-cloudflare build
      - name: Deploy
        run: npx wrangler deploy
